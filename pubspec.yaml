name: inventory_analyzer
description: محلل المخزون والتقارير الذكي - تطبيق احترافي لإدارة وتحليل بيانات المخزون باستخدام OCR والذكاء الاصطناعي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # File & Media
  file_picker: ^8.0.0+1
  image_picker: ^1.0.7
  excel: ^4.0.3
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2

  # Charts
  fl_chart: ^0.68.0

  # UI & Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1  # fallback only; prefer system font

  # OCR related (placeholders / future)
  # google_mlkit_text_recognition: ^0.13.0
  # google_mlkit_commons: ^0.7.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # fonts: use system font as required (no custom font bundling)