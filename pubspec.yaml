name: inventory_analyzer
description: "محلل المخزون الذكي — إدارة وتحليل مخزون offline-first"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # جزء من SDK نفسه (بلا أي قيد نسخة خارجي) — يفعّل RTL/العربية الكاملة في
  # ودجات Material الجاهزة (منتقي التاريخ، شريط اللغة، إلخ)
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # إدارة الحالة — نفس نمط Provider المستخدم في مشروع "كادي" سابقًا
  provider: ^6.1.2

  # تخزين محلي يعمل على أندرويد والويب معًا بدون أي كود Native
  # (تفاديًا لعائلة مشاكل compileSdk/NDK الموثّقة في دليل الأعطال)
  hive_ce: ">=2.10.0 <3.0.0"
  hive_ce_flutter: ">=2.1.0 <3.0.0"
  path_provider: ^2.1.4

  # استيراد الملفات والصور
  file_picker: ">=8.0.0 <11.0.0"
  image_picker: ^1.1.2
  image: ^4.3.0

  # قراءة/كتابة إكسل وCSV
  excel: ">=4.0.0 <5.0.0"
  csv: ^6.0.0

  # الرسوم البيانية
  fl_chart: ">=0.68.0 <2.0.0"

  # توليد PDF ومشاركة/طباعة (ومعاينة الصفحات كصور لملفات PDF المستوردة)
  pdf: ">=3.10.0 <5.0.0"
  printing: ">=5.10.0 <8.0.0"
  # نسخة مثبّتة بدقة لأنها الحل الموثّق في دليل الأعطال لتعارضها المعروف مع printing على الويب
  share_plus: ^12.0.2
  # يوفّر XFile المستخدَم مباشرة عند بناء ShareParams — اعتمادية مباشرة صريحة
  # بدل الاتكال الهش على كونها اعتمادية غير مباشرة عبر share_plus فقط
  cross_file: ">=0.3.0 <1.0.0"
  # إصلاح تشكيل الحروف العربية (وصل الحروف) عند رسمها داخل حزمة pdf
  # ملاحظة: الحزمة لا تزال قبل 1.0.0، لذا القيد هنا متعمَّد الاتساع
  arabic_reshaper: ">=0.0.1 <2.0.0"

  # استخراج البيانات من الصور/PDF عبر نموذج ذكاء اصطناعي متعدد الوسائط (اختياري، أونلاين فقط وقت الاستيراد)
  http: ^1.2.2
  flutter_secure_storage: ">=9.0.0 <11.0.0"

  # أدوات عامة
  # ⚠️ قيد متعمَّد الاتساع: flutter_localizations (من SDK نفسه) يفرض إصدار
  # intl محددًا داخليًا يتغيّر بين إصدارات Flutter، ولا يمكنني التحقق من
  # الرقم الدقيق لإصدارك هنا. قيد ضيق (^0.19.0 مثلاً) قد يُفشل
  # flutter pub get بتعارض إصدارات من أول أمر. لو ظهر تعارض رغم ذلك، شغّل
  # `flutter pub get` واقرأ الرقم الذي يقترحه Dart نفسه في رسالة الخطأ.
  intl: ">=0.19.0 <1.0.0"
  uuid: ^4.5.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # مجلد وليس ملفًا محددًا: مرجع "متسامح" لا يُفشل البناء إن كان فارغًا مبدئيًا.
  # لا حاجة لقسم fonts: هنا لأن الخط العربي يُحمَّل يدويًا داخل حزمة pdf عبر
  # rootBundle.load() (راجع report_export_service.dart)، وليس كخط Flutter
  # مُسجَّل عبر TextStyle — تسجيل خط عبر fonts: يتحقق من وجود الملف *وقت
  # البناء* ويُفشل البناء بالكامل إن كان غائبًا، وهو خطر لا داعي له هنا.
  assets:
    - assets/fonts/
